<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 220 125" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Glassmorphic Shell Background Gradient -->
    <linearGradient id="glassBg_protect_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Glossy White Sheet Gradient -->
    <linearGradient id="sheetGrad_protect_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Red PDF Badge Gradient -->
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowFilter_protect_pdf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow3D_protect_pdf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Glassmorphic Card Container -->
  <rect width="220" height="125" rx="14" fill="url(#glassBg_protect_pdf)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

  <!-- Neon Ambient Halo Background Glow -->
  <circle cx="110" cy="62" r="45" fill="#8b5cf6" opacity="0.25" filter="blur(16px)" />

  <!-- 3D Graphics Layer -->
  
      
    <g transform="translate(40, 26)" filter="url(#shadow3D_protect_pdf)">
      <!-- 3D Glossy White Sheet Body -->
      <rect width="58" height="72" rx="10" fill="url(#sheetGrad_protect_pdf)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
      
      <!-- Top Fold Corner Graphic -->
      <path d="M44,0 L58,14 L44,14 Z" fill="#cbd5e1"/>
      
      
      <!-- Header Badge Block -->
      <rect x="6" y="8" width="46" height="28" rx="5" fill="url(#pdfGrad)"/>
      <text x="29" y="26" fill="#ffffff" font-size="13" font-weight="900" font-family="'Outfit', sans-serif" text-anchor="middle">PDF</text>
      

      

      
    </g>
  

      <!-- 3D Security Shield & Gold Lock -->
      <g transform="translate(125, 25)" filter="url(#glowFilter_protect_pdf)">
        <path d="M30,5 L5,14 V36 C5,54 30,68 30,68 C30,68 55,54 55,36 V14 L30,5 Z" fill="url(#shieldGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
        <rect x="22" y="32" width="16" height="18" rx="4" fill="#fbbf24"/>
        <path d="M25,32 V26 C25,23 27,20 30,20 C33,20 35,23 35,26 V32" stroke="#fbbf24" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>
    
</svg>