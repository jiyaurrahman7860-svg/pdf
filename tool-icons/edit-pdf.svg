<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 220 125" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Glassmorphic Shell Background Gradient -->
    <linearGradient id="glassBg_edit_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Glossy White Sheet Gradient -->
    <linearGradient id="sheetGrad_edit_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Red PDF Badge Gradient -->
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowFilter_edit_pdf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow3D_edit_pdf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Glassmorphic Card Container -->
  <rect width="220" height="125" rx="14" fill="url(#glassBg_edit_pdf)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

  <!-- Neon Ambient Halo Background Glow -->
  <circle cx="110" cy="62" r="45" fill="#3b82f6" opacity="0.25" filter="blur(16px)" />

  <!-- 3D Graphics Layer -->
  
      <!-- Text Box + Pencil -->
      <g transform="translate(30, 30)" filter="url(#shadow3D_edit_pdf)">
        <rect width="70" height="64" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
        <text x="35" y="42" fill="#1e40af" font-size="28" font-weight="900" font-family="'Outfit', sans-serif" text-anchor="middle">T</text>
      </g>

      <!-- 3D Pencil Graphic -->
      <g transform="translate(115, 45) rotate(45)" filter="url(#glowFilter_edit_pdf)">
        <rect width="14" height="50" rx="3" fill="#f59e0b"/>
        <path d="M0,50 L7,62 L14,50 Z" fill="#b45309"/>
        <path d="M4,55 L7,62 L10,55 Z" fill="#0f172a"/>
        <rect width="14" height="10" fill="#e11d48" rx="2"/>
      </g>
    
</svg>