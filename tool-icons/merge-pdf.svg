<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 220 125" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Glassmorphic Shell Background Gradient -->
    <linearGradient id="glassBg_merge_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Glossy White Sheet Gradient -->
    <linearGradient id="sheetGrad_merge_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Red PDF Badge Gradient -->
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowFilter_merge_pdf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow -->
    <filter id="shadow3D_merge_pdf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Glassmorphic Card Container -->
  <rect width="220" height="125" rx="14" fill="url(#glassBg_merge_pdf)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

  <!-- Neon Ambient Halo Background Glow -->
  <circle cx="110" cy="62" r="45" fill="#a855f7" opacity="0.25" filter="blur(16px)" />

  <!-- 3D Graphics Layer -->
  
      <!-- Stack of 3 PDFs merging -->
      <g opacity="0.6">
    <g transform="translate(22, 22)" filter="url(#shadow3D_merge_pdf)">
      <!-- 3D Glossy White Sheet Body -->
      <rect width="46" height="58" rx="10" fill="url(#sheetGrad_merge_pdf)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
      
      <!-- Top Fold Corner Graphic -->
      <path d="M32,0 L46,14 L32,14 Z" fill="#cbd5e1"/>
      
      
      <!-- Header Badge Block -->
      <rect x="6" y="8" width="34" height="22" rx="5" fill="url(#pdfGrad)"/>
      <text x="23" y="22" fill="#ffffff" font-size="13" font-weight="900" font-family="'Outfit', sans-serif" text-anchor="middle">PDF</text>
      

      

      
    </g>
  </g>
      <g opacity="0.8">
    <g transform="translate(32, 28)" filter="url(#shadow3D_merge_pdf)">
      <!-- 3D Glossy White Sheet Body -->
      <rect width="46" height="58" rx="10" fill="url(#sheetGrad_merge_pdf)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
      
      <!-- Top Fold Corner Graphic -->
      <path d="M32,0 L46,14 L32,14 Z" fill="#cbd5e1"/>
      
      
      <!-- Header Badge Block -->
      <rect x="6" y="8" width="34" height="22" rx="5" fill="url(#pdfGrad)"/>
      <text x="23" y="22" fill="#ffffff" font-size="13" font-weight="900" font-family="'Outfit', sans-serif" text-anchor="middle">PDF</text>
      

      

      
    </g>
  </g>
      
    <g transform="translate(42, 34)" filter="url(#shadow3D_merge_pdf)">
      <!-- 3D Glossy White Sheet Body -->
      <rect width="48" height="62" rx="10" fill="url(#sheetGrad_merge_pdf)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
      
      <!-- Top Fold Corner Graphic -->
      <path d="M34,0 L48,14 L34,14 Z" fill="#cbd5e1"/>
      
      
      <!-- Header Badge Block -->
      <rect x="6" y="8" width="36" height="22" rx="5" fill="url(#pdfGrad)"/>
      <text x="24" y="22" fill="#ffffff" font-size="13" font-weight="900" font-family="'Outfit', sans-serif" text-anchor="middle">PDF</text>
      

      

      
    </g>
  

      <g filter="url(#glowFilter_merge_pdf)">
        <path d="M100,62 L122,62 M114,54 L124,62 L114,70" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round"/>
      </g>

      
    <g transform="translate(134, 28)" filter="url(#shadow3D_merge_pdf)">
      <!-- 3D Glossy White Sheet Body -->
      <rect width="56" height="70" rx="10" fill="url(#sheetGrad_merge_pdf)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
      
      <!-- Top Fold Corner Graphic -->
      <path d="M42,0 L56,14 L42,14 Z" fill="#cbd5e1"/>
      
      
      <!-- Header Badge Block -->
      <rect x="6" y="8" width="44" height="22" rx="5" fill="url(#pdfGrad)"/>
      <text x="28" y="22" fill="#ffffff" font-size="13" font-weight="900" font-family="'Outfit', sans-serif" text-anchor="middle">PDF</text>
      

      

      
    </g>
  
    
</svg>